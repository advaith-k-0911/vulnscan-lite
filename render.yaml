# ==============================================================================
# VulnScan Lite - Render Blueprint Specification
# Infrastructure as Code (IaC) for deploying VulnScan Lite on Render
# ==============================================================================

version: "1"

# 1. Managed PostgreSQL Database
databases:
  - name: vulnscan-db
    databaseName: vulnscan
    user: vulnscan_user
    plan: free
    region: oregon

# 2. Application Services
services:
  # ----------------------------------------------------------------------------
  # A. Redis Message Broker & Rate Limiting Store (Private Service)
  # ----------------------------------------------------------------------------
  - type: redis
    name: vulnscan-redis
    region: oregon
    plan: free
    ipAllowList: [] # Private to internal services; not exposed to public internet
    maxmemoryPolicy: noeviction

  # ----------------------------------------------------------------------------
  # B. FastAPI REST API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: vulnscan-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: VulnScan Lite
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vulnscan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_SCAN_CREATION_LIMIT
        value: "10"
      - key: RATE_LIMIT_SCAN_CREATION_WINDOW
        value: "60"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      - key: ENABLE_HSTS
        value: "True"
      - key: CORS_ORIGINS
        sync: false # Set to your deployed frontend URL (e.g., https://vulnscan-frontend.onrender.com)

  # ----------------------------------------------------------------------------
  # C. Celery Background Worker (Passive Scanner Orchestration)
  # ----------------------------------------------------------------------------
  - type: worker
    name: vulnscan-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: celery -A backend.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: APP_NAME
        value: VulnScan Lite
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vulnscan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vulnscan-redis
          property: connectionString

  # ----------------------------------------------------------------------------
  # D. React 18 Single Page Application (Static Site)
  # ----------------------------------------------------------------------------
  - type: static
    name: vulnscan-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL (e.g., https://vulnscan-backend.onrender.com)
