# ==============================================================================
# VulnScan Lite - Render Blueprint Specification (Free-Tier Compatible)
# ==============================================================================

version: "1"

# 1. Managed PostgreSQL Database (Free Tier)
databases:
  - name: vulnscan-db
    databaseName: vulnscan
    user: vulnscan_user
    plan: free
    region: oregon

# 2. Application Services
services:
  # ----------------------------------------------------------------------------
  # A. FastAPI REST API Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: vulnscan-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: VulnScan Lite
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vulnscan-db
          property: connectionString
      # Render free services do not include a Celery worker. Run scans after
      # returning HTTP 202 in FastAPI's background task runner instead.
      - key: SCAN_EXECUTION_MODE
        value: background
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_SCAN_CREATION_LIMIT
        value: "10"
      - key: RATE_LIMIT_SCAN_CREATION_WINDOW
        value: "60"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      - key: ENABLE_HSTS
        value: "True"
      - key: CORS_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # B. React 18 Single Page Application (Static Site - Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: vulnscan-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
